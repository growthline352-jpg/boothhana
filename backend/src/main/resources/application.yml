spring:
  application:
    name: boothhana-backend
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: booth_session
      cleanup-cron: "0 */10 * * * *"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/boothhana}
    username: ${DATABASE_USERNAME:boothhana}
    password: ${DATABASE_PASSWORD:boothhana}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:local-placeholder}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
app:
  collection:
    auto-approve: ${COLLECTOR_AUTO_APPROVE:true}
    graph:
      enabled: ${APP_COLLECTION_GRAPH_ENABLED:false}
  notifications:
    push:
      enabled: ${APP_NOTIFICATIONS_PUSH_ENABLED:false}
      public-key: ${WEB_PUSH_PUBLIC_KEY:}
      private-key: ${WEB_PUSH_PRIVATE_KEY:}
      subject: ${WEB_PUSH_SUBJECT:}
  discovery:
    compare-enabled: ${EVENT_COMPARE_ENABLED:false}
    popups-enabled: ${POPUP_EXPLORE_ENABLED:true}
  support:
    guest-enabled: ${SUPPORT_GUEST_ENABLED:false}
    rate-secret: ${SUPPORT_RATE_SECRET:}
    attachments-enabled: ${SUPPORT_ATTACHMENTS_ENABLED:false}
    attachment-concurrency: ${SUPPORT_ATTACHMENT_CONCURRENCY:4}
    private-bucket: ${GCS_PRIVATE_BUCKET:}
  collector:
    token: ${BOOTH_COLLECTOR_TOKEN:}
  upload:
    max-per-hour: ${UPLOAD_MAX_PER_HOUR:20}
    max-bytes-per-day: ${UPLOAD_MAX_BYTES_PER_DAY:104857600}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  admin-login:
    username: ${ADMIN_LOGIN_USERNAME:}
    password-hash: ${ADMIN_LOGIN_PASSWORD_HASH:}
  storage:
    public-url: ${GCS_PUBLIC_URL:}
  gcs:
    project-id: ${GCS_PROJECT_ID:}
    public-bucket: ${GCS_PUBLIC_BUCKET:}
