<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부스하나 v12 화면 시안</title><style>/* v10 — shared visual tokens; local/system fonts only. */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --paper: #ffffff;
  --soft: #f1f4f7;
  --ink: #202c3b;
  --muted: #5f6b7a;
  --line: #dfe5eb;
  --line-strong: #a8b4c1;
  --accent: #b84532;
  --accent-hover: #9e3828;
  --accent-soft: #fff1eb;
  --teal: #176851;
  --gold: #94620d;
  --danger: #b52b32;
  --shadow: 0 2px 8px rgb(23 40 57 / 4%);
  --radius: 10px;
  --radius-card: 18px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --font-ui: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  --focus: #2167b0;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Segoe UI", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.55; }
a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(216, 93, 69, .28); outline-offset: 2px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 14px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(36px, 5vw, 68px); line-height: 1.01; }
h2 { margin-bottom: 10px; font-size: 27px; line-height: 1.2; }
h3 { margin-bottom: 8px; font-size: 18px; line-height: 1.3; }
.eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.lead { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: 18px; line-height: 1.65; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.page-shell { min-height: 100vh; }
.section-pad, .content-wrap { width: min(1180px, calc(100% - 48px)); margin-inline: auto; }
.content-wrap { padding-block: 52px 84px; }
.section { padding-block: 72px; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: 68px; padding: 0 var(--space-5); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(16px); }
.brand { display: inline-flex; align-items: center; min-height: 44px; }
.brand-logo { display: block; flex: 0 0 auto; width: 160px; height: 52px; overflow: hidden; }
.brand-logo img { width: 100%; height: auto; transform: translateY(-32.5%); }
.topbar-actions, .toolbar, .row-actions, .button-row, .status-row, .detail-inline { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.public-nav > a:not(.btn) { min-height: 44px; padding: 11px 8px; color: var(--muted); font-weight: 700; }
.public-nav > a.active { color: var(--accent); }
.btn, .chip { display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: var(--radius); font-weight: 800; line-height: 1.2; }
.btn { min-height: 42px; padding: 10px 16px; background: white; color: var(--ink); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: white; }
.btn.secondary { border-color: var(--line-strong); background: white; }
.btn.subtle { border-color: var(--line); background: var(--paper); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: white; }
.btn.danger:not(.subtle) { color: white; background: var(--danger); }
.btn.wide { width: 100%; }
.btn.disabled { pointer-events: none; opacity: .5; }
.chip { min-height: 28px; padding: 5px 9px; background: #eee8de; color: var(--muted); font-size: 12px; }
.chip.active { background: rgba(19,119,110,.11); color: var(--teal); }
.chip.warning { background: rgba(217,167,45,.16); color: #8b6508; }
.chip.danger { background: rgba(184,69,52,.1); color: var(--danger); }
.chip.info { background: #edf2fa; color: #466481; }
.input, .select, .textarea { width: 100%; min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: white; color: var(--ink); padding: 10px 12px; }
.textarea { resize: vertical; }
.input::placeholder, .textarea::placeholder { color: #9b8e82; }
.field { display: grid; gap: 7px; }
.field > span, .check-field { font-size: 14px; font-weight: 800; }
.field.full { grid-column: 1 / -1; }
.check-field { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.field-error { margin: 8px 0 0; color: var(--danger); font-size: 14px; font-weight: 700; }
.form-alert, .notice-banner { margin-bottom: 18px; padding: 14px 16px; border: 1px solid rgba(184,69,52,.35); border-radius: var(--radius); background: #fff7f4; color: var(--danger); }
.notice-banner { display: flex; align-items: center; gap: 10px; border-color: rgba(217,167,45,.35); background: #fffaf0; color: #70520d; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin-bottom: 38px; }
.page-header h1 { font-size: clamp(38px, 5vw, 62px); }
.section-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 28px; }
.section-heading.compact { margin-top: 48px; margin-bottom: 20px; }
.section-description, .item-meta, .empty-copy { color: var(--muted); }
.item-meta { margin-bottom: 7px; font-size: 14px; }
.price, .product-price { margin: 0; font-family: Georgia, serif; font-size: 22px; font-weight: 800; }
.stock-text { margin: 5px 0 0; color: var(--teal); font-size: 14px; font-weight: 800; }
.panel { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.panel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.hero { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 60px; min-height: 650px; padding-block: 80px; }
.hero-copy h1 { max-width: 760px; word-break: keep-all; overflow-wrap: break-word; }
.hero-search { display: flex; gap: 8px; max-width: 620px; margin-top: 28px; }
.hero-metrics { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; color: var(--muted); font-size: 14px; }
.hero-metrics strong { color: var(--ink); }
.hero-collage { position: relative; min-height: 500px; }
.hero-collage img { position: absolute; width: 58%; height: 58%; border: 8px solid white; border-radius: var(--radius); box-shadow: var(--shadow); }
.hero-collage .collage-1 { top: 0; left: 0; }
.hero-collage .collage-2 { top: 11%; right: 0; }
.hero-collage .collage-3 { bottom: 0; left: 8%; }
.hero-collage .collage-4 { right: 2%; bottom: 3%; width: 42%; height: 42%; }
.product-grid, .event-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; }
.event-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
.product-card, .event-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: white; transition: transform .16s ease, box-shadow .16s ease; }
.product-card:hover, .event-card:hover, .booth-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.product-card .image { aspect-ratio: 1 / 1; background: var(--soft); }
.product-card-body, .event-card-body { padding: 16px; }
.product-card-body h3, .event-card-body h3 { margin-top: 12px; }
.product-card.is-soldout .image { filter: grayscale(.75); opacity: .7; }
.event-card-image { aspect-ratio: 16 / 10; }
.feature-band { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; padding-block: 50px; border-block: 1px solid var(--line); background: var(--soft); }
.editorial-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.column-title { padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.editorial-event { min-height: 220px; padding: 30px; border: 1px solid var(--line); background: white; }
.editorial-event.soft { background: var(--paper); }
.editorial-event h3 { margin-top: 28px; font-family: Georgia, serif; font-size: 28px; }
.editorial-event a { color: var(--accent); font-weight: 800; }
.creators-section { padding-bottom: 96px; }
.creator-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.creator-card { text-align: center; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); }
.avatar { width: 100px; height: 100px; margin: 0 auto 16px; overflow: hidden; border-radius: 50%; }
.site-footer { border-top: 1px solid var(--line); background: var(--paper); }
.site-footer-inner { display: flex; justify-content: space-between; gap: 24px; width: min(1180px, calc(100% - 48px)); margin: auto; padding: 32px 0; }
.site-footer p { margin: 6px 0 0; color: var(--muted); }
.footer-links { display: flex; gap: 16px; align-items: center; }
.filter-bar, .search-panel { display: grid; grid-template-columns: minmax(0,1fr) minmax(180px,260px); gap: 10px; margin-bottom: 24px; padding: 16px; border: 1px solid var(--line); background: var(--soft); }
.search-panel { grid-template-columns: minmax(0,1fr) auto; }
.state-panel { display: grid; justify-items: center; align-content: center; min-height: 320px; padding: 38px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--paper); text-align: center; }
.state-panel h2 { margin-top: 14px; }
.state-panel p { max-width: 520px; color: var(--muted); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.state-symbol { display: grid; place-items: center; width: 48px; height: 48px; border: 2px solid var(--line-strong); border-radius: 50%; font-size: 24px; font-weight: 900; }
.error-state .state-symbol { border-color: var(--danger); color: var(--danger); }
@keyframes spin { to { transform: rotate(360deg); } }
.event-hero, .booth-hero { display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; gap: 48px; padding-bottom: 48px; border-bottom: 1px solid var(--line); }
.event-poster, .booth-visual { overflow: hidden; aspect-ratio: 4 / 3; border-radius: var(--radius); box-shadow: var(--shadow); }
.booth-hero { grid-template-columns: .7fr 1.3fr; }
.detail-inline { margin-top: 22px; color: var(--muted); }
.detail-inline > span:not(.chip)::after { content: '·'; padding-left: 8px; }
.booth-list, .console-list, .reservation-list { display: grid; gap: 12px; }
.booth-card, .list-row, .reservation-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: white; }
.booth-card .thumb { flex: 0 0 120px; width: 120px; height: 100px; overflow: hidden; border-radius: var(--radius); }
.booth-card-copy { flex: 1; }
.booth-card-copy p { margin-bottom: 8px; }
.pinned-notice { display: flex; align-items: flex-start; gap: 14px; margin: 24px 0; padding: 18px; border: 1px solid rgba(217,167,45,.45); background: #fffaf0; }
.pinned-notice p { margin: 4px 0 0; }
.detail-columns, .split-layout, .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 24px; }
.detail-list { margin: 0; }
.detail-list > div { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.detail-list dt { color: var(--muted); font-size: 14px; font-weight: 800; }
.detail-list dd { margin: 0; }
.product-detail { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: start; }
.product-image { overflow: hidden; aspect-ratio: 1 / 1; border-radius: var(--radius); background: var(--soft); }
.product-summary { position: sticky; top: 100px; padding: 28px; border-top: 3px solid var(--ink); }
.product-summary h2 { margin-top: 18px; font-family: Georgia, serif; font-size: 36px; }
.product-price { margin-bottom: 10px; font-size: 32px; }
.plain-list { padding-left: 20px; color: var(--muted); }
.auth-page { display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: center; min-height: calc(100vh - 69px); padding-block: 64px; }
.auth-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.auth-card { padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.auth-card p { min-height: 76px; color: var(--muted); }
.reservation-layout, .pos-layout { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 24px; align-items: start; }
.reservation-products { display: grid; gap: 10px; }
.reservation-item { display: grid; grid-template-columns: 72px 1fr 90px; align-items: center; gap: 14px; padding: 10px; border: 1px solid var(--line); background: white; }
.reservation-item img { width: 72px; height: 72px; border-radius: 4px; }
.reservation-item span { display: grid; }
.reservation-item small { color: var(--muted); }
.quantity-input { text-align: center; }
.order-summary, .pos-cart { position: sticky; top: 92px; }
.summary-row, .summary-total { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.summary-total { margin: 12px 0; border-bottom: 0; font-size: 18px; }
.reservation-card { padding: 24px; }
.reservation-card h2 { margin-bottom: 4px; }
.ticket { display: grid; grid-template-columns: 1fr 310px; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
.ticket-main { padding: 36px; }
.reservation-no { font-size: 34px; }
.qr-panel { display: grid; place-items: center; align-content: center; padding: 30px; border-left: 1px dashed var(--line-strong); background: white; text-align: center; }
.qr-panel img { width: 220px; height: 220px; }
.qr-panel p { color: var(--muted); }
.qr-placeholder { display: grid; place-items: center; width: 220px; height: 220px; background: var(--soft); }
.console-shell { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: 68px 1fr; min-height: 100vh; }
.console-topbar { grid-column: 1 / -1; }
.sidebar { grid-row: 2; padding: 28px 18px; border-right: 1px solid var(--line); background: var(--paper); }
.sidebar-user { display: block; margin-bottom: 24px; font-size: 20px; }
.side-nav { display: grid; gap: 5px; margin-bottom: 30px; }
.side-link { display: block; padding: 10px 12px; border-radius: var(--radius); color: var(--muted); font-weight: 800; }
.side-link.active { background: white; color: var(--accent); box-shadow: 0 2px 10px rgba(50,30,10,.06); }
.mobile-role-nav { display: none; }
.console-main { min-width: 0; padding: 48px; }
.console-main .page-header h1 { font-size: clamp(36px,4vw,58px); }
.metric-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 20px; }
.metric-grid article { display: grid; padding: 22px; border: 1px solid var(--line); background: white; }
.metric-grid span, .metric-grid small { color: var(--muted); }
.metric-grid strong { font-family: Georgia, serif; font-size: 42px; }
.quick-links { display: grid; }
.quick-links a { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--line); font-weight: 800; }
.editorial-panel { background: var(--soft); }
.form-panel { margin-bottom: 22px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.wide-form { max-width: 880px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; min-width: 760px; border-collapse: collapse; background: white; }
th, td { padding: 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { background: var(--soft); color: var(--muted); font-size: 13px; }
td small { display: block; max-width: 340px; margin-top: 3px; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.pickup-card { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.pos-products { display: grid; grid-template-columns: repeat(3, minmax(150px,1fr)); gap: 10px; }
.pos-product { display: grid; gap: 12px; min-height: 150px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: white; text-align: left; }
.pos-product strong { font-size: 17px; }
.pos-product:hover:not(:disabled) { border-color: var(--accent); box-shadow: var(--shadow); }
.pos-sale-detail { margin-top: 18px; }
.pos-sale-detail .table-wrap { margin-top: 18px; }
.notice-row { align-items: flex-start; }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .hero-collage { min-height: 420px; }
  .product-grid { grid-template-columns: repeat(2,1fr); }
  .event-grid { grid-template-columns: repeat(2,1fr); }
  .creator-grid { grid-template-columns: repeat(2,1fr); }
  .console-shell { grid-template-columns: 1fr; grid-template-rows: 68px auto 1fr; }
  .console-topbar { grid-column: 1; }
  .sidebar { display: none; }
  .mobile-role-nav { display: flex; grid-row: 2; gap: 4px; overflow-x: auto; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .mobile-role-nav a { white-space: nowrap; padding: 8px 10px; color: var(--muted); font-weight: 800; }
  .mobile-role-nav a.active { color: var(--accent); }
  .console-main { grid-row: 3; padding: 32px 24px; }
  .reservation-layout, .pos-layout { grid-template-columns: 1fr; }
  .order-summary, .pos-cart, .product-summary { position: static; }
  .pos-products { grid-template-columns: repeat(2,1fr); }
}

.image-uploader-row { display: flex; align-items: center; gap: 1rem; }
.image-uploader-row img { width: 112px; height: 112px; border-radius: 14px; object-fit: cover; border: 1px solid var(--line); }
.image-uploader small { color: var(--muted); }

@media (max-width: 720px) {
  .image-uploader-row { align-items: stretch; flex-direction: column; }
  .section-pad, .content-wrap { width: min(100% - 28px, 1180px); }
  .content-wrap { padding-block: 34px 64px; }
  .topbar { padding: 0 14px; }
  .brand-logo { width: 130px; height: 44px; }
  .public-nav > a:not(.btn) { display: none; }
  .hero { gap: 34px; padding-block: 48px; }
  .hero h1 { font-size: 43px; }
  .hero-search { display: grid; grid-template-columns: 1fr; }
  .hero-collage { min-height: 330px; }
  .section { padding-block: 54px; }
  .section-heading, .feature-band, .page-header { align-items: flex-start; flex-direction: column; }
  .product-grid, .event-grid, .creator-grid, .editorial-columns, .detail-columns, .split-layout, .dashboard-grid, .auth-page, .auth-options, .event-hero, .booth-hero, .product-detail, .ticket { grid-template-columns: 1fr; }
  .event-card { display: grid; grid-template-columns: 120px 1fr; }
  .event-card-image { aspect-ratio: auto; min-height: 150px; }
  .booth-hero { display: flex; flex-direction: column; }
  .booth-visual { width: 100%; }
  .booth-card, .list-row, .reservation-card, .pickup-card { align-items: flex-start; flex-direction: column; }
  .booth-card .thumb { width: 100%; height: 170px; }
  .filter-bar { grid-template-columns: 1fr; }
  .ticket { display: block; }
  .qr-panel { border-top: 1px dashed var(--line-strong); border-left: 0; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .reservation-item { grid-template-columns: 58px 1fr; }
  .reservation-item img { width: 58px; height: 58px; }
  .quantity-input { grid-column: 2; }
  .metric-grid { grid-template-columns: 1fr; }
  .pos-products { grid-template-columns: 1fr; }
  .console-main { padding: 28px 14px; }
  .site-footer-inner { align-items: flex-start; flex-direction: column; width: calc(100% - 28px); }
}

/* v6 public category experience. Scoped so Creator/Admin retain their existing layout. */
.public-shell{--d-ink:#202733;--d-muted:#737a86;--d-line:#e8ebef;--d-accent:#e36148;--d-soft:#fff4ee;color:var(--d-ink);background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif}
.public-shell h1,.public-shell h2,.public-shell h3{font-family:inherit;letter-spacing:-.045em}
.public-shell h1{line-height:1.34}.public-shell a:focus-visible,.public-shell button:focus-visible,.public-shell input:focus-visible,.public-shell select:focus-visible,.public-shell summary:focus-visible{outline:3px solid #b85133;outline-offset:4px}
.public-shell button{font-family:inherit}.public-shell svg{flex-shrink:0}.public-shell main{min-height:60vh;outline:none}.public-shell .discovery-container{width:min(1180px,calc(100% - 64px));margin-inline:auto}
.discovery-sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.discovery-skip{position:fixed;top:-80px;left:16px;z-index:100;padding:12px 20px;background:#202733;color:white;border-radius:8px}.discovery-skip:focus{top:10px}
.discovery-header{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--d-line);background:rgba(255,255,255,.97);backdrop-filter:blur(16px)}
.discovery-header-inner{display:flex;align-items:center;gap:38px;min-height:80px;width:min(1300px,calc(100% - 64px));margin:auto}
.discovery-brand{flex-shrink:0}.discovery-brand .brand-logo{width:130px;height:44px}.discovery-brand .brand-logo img{transform:translateY(-32.5%)}

/*
 * v10 visual system
 * Imported once, AFTER route feature styles and global.css in main.tsx.
 * Feature files keep geometry, dialog lifecycle and view state; this final layer
 * owns typography, semantic colours, surfaces, component spacing and responsive
 * presentation. No remote fonts/assets, CSS-generated factual content or JS.
 */

/* 1. Shared foundations ---------------------------------------------------- */
html { font-family: var(--font-ui); background: var(--bg); }
body { font-family: var(--font-ui); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
p { word-break: keep-all; overflow-wrap: anywhere; }
input[type="file"]::file-selector-button { border: 0; border-radius: 6px; padding: 7px 10px; margin-right: 10px; color: #315b82; background: #eaf1f8; font: inherit; font-weight: 650; cursor: pointer; }
h1, h2, h3, .price, .product-price, .metric-grid strong { font-family: var(--font-ui); letter-spacing: -.035em; }
h1 { font-size: clamp(28px, 3.5vw, 42px); line-height: 1.35; font-weight: 750; }
h2 { font-size: 23px; line-height: 1.4; font-weight: 750; }
h3 { font-size: 18px; line-height: 1.5; font-weight: 700; }
button, input, select, textarea { font-family: inherit; }
button, a, input, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
button, .btn, input, select, textarea { transition: border-color .16s, background-color .16s, box-shadow .16s; }
button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .58; cursor: not-allowed; }
button:disabled:hover { transform: none; box-shadow: none; }
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--focus); outline-offset: 3px;
}
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
[hidden] { display: none !important; }
.eyebrow { font-size: 12px; font-weight: 750; letter-spacing: .055em; line-height: 1.6; margin-bottom: 8px; }
.lead { font-size: 16px; color: var(--muted); line-height: 1.75; max-width: 750px; }
.item-meta, .section-description, .empty-copy { color: var(--muted); font-size: 14px; }
.mono { font-size: .9em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.content-wrap { padding-block: 36px 72px; }
.panel { padding: 24px; border-color: var(--line); border-radius: var(--radius-card); background: var(--paper); box-shadow: var(--shadow); }
.panel-header { gap: 16px; align-items: flex-start; }
.panel-header h2 { margin-bottom: 6px; }
.panel-actions { flex-wrap: wrap; }
.page-header { margin-bottom: 28px; gap: 24px; align-items: center; }
.page-header h1, .console-main .page-header h1 { font-size: clamp(26px, 3vw, 36px); margin-bottom: 10px; }
.page-header .eyebrow { color: var(--muted); font-size: 12px; }
.page-header .lead { margin: 0; }
.btn { min-height: 44px; border-radius: 10px; padding: 11px 16px; gap: 8px; font-size: 14px; line-height: 1.4; font-weight: 700; text-align: center; text-wrap: pretty; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 4px rgb(100 40 20 / 8%); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.secondary { background: #fff; border-color: #cbd5de; }
.btn.secondary:hover:not(:disabled), .btn.subtle:hover:not(:disabled) { border-color: #9eaebc; background: #f3f6f8; }
.btn.subtle { background: #f7f9fb; border-color: var(--line); }
.btn.danger { color: var(--danger); background: #fff; border-color: #e8b8bc; }
.btn.danger:not(.subtle) { color: #fff; background: var(--danger); border-color: var(--danger); }
.btn.danger:hover:not(:disabled) { box-shadow: 0 0 0 2px #b52b3214; }
.chip { min-height: 28px; padding: 5px 9px; border-radius: 6px; font-size: 12px; line-height: 1.45; font-weight: 650; background: #edf1f5; color: #53606e; white-space: normal; }
.chip.active { background: #eaf6ef; color: #176344; }
.chip.warning { background: #fff3d9; color: #785008; }
.chip.danger { background: #fdecee; color: #a9242c; }
.chip.info { background: #eaf2fc; color: #235789; }
.input, .select, .textarea { background: #fff; border: 1px solid #bdc9d4; border-radius: 9px; min-height: 46px; padding: 10px 12px; font-size: 16px; line-height: 1.5; }
.input:hover, .select:hover, .textarea:hover { border-color: #8696a6; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px #2167b011; }
.input::placeholder, .textarea::placeholder { color: #6c7987; opacity: 1; }
.field { gap: 8px; min-width: 0; }
.field > span, .check-field { color: #3a495a; font-size: 14px; font-weight: 650; }
.form-grid { gap: 20px; }
.form-alert, .notice-banner { font-size: 14px; line-height: 1.65; padding: 14px 16px; border-radius: 10px; overflow-wrap: anywhere; }
.form-alert { color: #8c2630; background: #fff4f4; border-color: #efc7cb; }
.notice-banner { color: #715110; background: #fffaed; border-color: #ebdbaa; }
.state-panel { background: #fff; border: 1px solid var(--line); min-height: 260px; padding: 40px 24px; border-radius: 16px; }
.state-panel h2 { font-size: 21px; line-height: 1.5; }
.state-panel p { margin-bottom: 20px; font-size: 15px; }
.state-symbol { border: 0; background: #edf2f7; color: #586c80; border-radius: 14px; width: 54px; height: 54px; }
.error-state .state-symbol { background: #fff0f0; }
.spinner { border-width: 3px; }
.table-wrap { background: #fff; border-radius: 14px; margin-top: 16px; }
th { background: #f3f6f9; font-size: 13px; font-weight: 700; color: #546477; }
th, td { padding: 16px; line-height: 1.6; }
td { font-size: 14px; }
td .btn { min-height: 40px; padding: 8px 13px; font-size: 13px; }
tbody tr:hover { background: #f9fbfd; }
td small { font-size: 12px; line-height: 1.6; color: var(--muted); }
summary { cursor: pointer; line-height: 1.6; }
hr { border: 0; border-top: 1px solid var(--line); }
.catalog-external-link { color: #2b607f; text-underline-offset: 3px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
.catalog-external-link:hover { text-decoration: underline; }

/* 2. Public shell — category accents do NOT colour warnings or errors ------ */
.public-shell { --d-ink: #202c3b; --d-muted: #5f6b7a; --d-line: #dfe5eb; --d-accent: #b84532; --d-soft: #fff1eb; color: var(--d-ink); background: var(--bg); font-family: var(--font-ui); }
.public-shell[data-category="exhibitions"], .discovery-theme-exhibitions { --d-accent: #285faf; --d-soft: #edf4ff; --accent: #285faf; --accent-hover: #214e91; }
.public-shell[data-category="festivals"], .discovery-theme-festivals { --d-accent: #176851; --d-soft: #edf7f1; --accent: #176851; --accent-hover: #10533f; }
.public-shell h1, .public-shell h2, .public-shell h3 { letter-spacing: -.035em; }
.public-shell :where(a, button, input, select, summary):focus-visible { outline-color: var(--focus); outline-offset: 3px; }
.public-shell .discovery-container { width: min(1180px, calc(100% - 64px)); }
.discovery-header { background: rgb(255 255 255 / 98%); border-bottom-color: var(--line); }
.discovery-header-inner { min-height: 76px; width: min(1260px, calc(100% - 56px)); gap: 44px; }
.discovery-brand .brand-logo { width: 140px; height: 46px; }
.discovery-category-nav { gap: 32px; }
.discovery-category-link { min-height: 54px; font-size: 16px; padding-inline: 4px; color: #63707f; gap: 8px; }
.discovery-category-link.is-current { color: var(--d-accent); }
.discovery-category-link.is-current:after { background: var(--d-accent); height: 3px; }
.discovery-soon { display: inline-block; margin-left: 6px; font-size: 12px; line-height: 1.45; color: #626f7b; background: #edf1f5; padding: 2px 5px; border-radius: 4px; }
.discovery-header-tools { gap: 10px; }
.discovery-reservations { min-height: 44px; padding: 8px 12px; gap: 8px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; color: #526171; }
.discovery-reservations:hover { background: #f5f7fa; }
.discovery-menu summary { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 9px; color: #526171; }
.discovery-menu-panel { top: 53px; width: 268px; padding: 9px; border-radius: 14px; box-shadow: 0 12px 40px #192b4020; }
.discovery-menu-panel p { font-size: 14px; }
.discovery-menu-panel > a, .discovery-menu-panel > button { font-size: 14px; min-height: 46px; padding: 12px; }
.discovery-footer { background: #fff; border-top: 1px solid var(--line); }
.discovery-footer-inner { padding-block: 36px; align-items: flex-start; }
.discovery-footer p { color: var(--muted); font-size: 14px; }
.discovery-footer small { color: var(--muted); font-size: 12px; line-height: 1.65; }
.discovery-footer-brand { font-size: 20px; color: var(--ink); }
.discovery-footer-brand span { font-size: 13px; color: #586779; margin-left: 12px; }
.discovery-footer nav { gap: 18px; flex-wrap: wrap; }
.discovery-footer nav a { min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; color: #536374; }

/* 3. Discovery home / category list --------------------------------------- */
.discovery-hero { background: linear-gradient(115deg, #fff8f4, #fffdfb 66%, #fcf4ef); border-bottom: 1px solid #eee5df; }
.discovery-theme-exhibitions .discovery-hero { background: linear-gradient(115deg, #eef5ff, #fff 80%); border-color: #dfe8f5; }
.discovery-theme-festivals .discovery-hero { background: linear-gradient(115deg, #eff8f2, #fff 80%); border-color: #dcebe2; }
.discovery-hero-inner { min-height: 342px; grid-template-columns: minmax(0, 1.4fr) minmax(310px, .8fr); padding-block: 40px; gap: 60px; }
.discovery-eyebrow { color: var(--d-accent); font-size: 12px; line-height: 1.5; letter-spacing: .04em; margin-bottom: 14px; }
.discovery-live-dot { width: 7px; height: 7px; }

.discovery-hero-copy > p { font-size: 15px; line-height: 1.8; color: #62666e; margin-bottom: 24px; }
.discovery-search { border: 1px solid #cdd5dd; box-shadow: 0 4px 12px #25374906; min-height: 58px; width: 100%; max-width: 620px; border-radius: 12px; gap: 12px; padding: 6px 6px 6px 16px; color: #687b8e; }

.discovery-hero-meta { margin-top: 14px; gap: 18px; color: #606d79; font-size: 12px; }
.discovery-hero-art.guide-card { height: auto; max-width: 352px; width: 100%; padding: 23px 24px 18px; border: 1px solid #e7ddd5; border-radius: 20px; background: #ffffffdb; box-shadow: 0 8px 24px #4b362808; }
.guide-card-title { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid #e8edf1; }
.guide-card-symbol { display: grid; place-items: center; width: 48px; height: 48px; background: var(--d-soft); color: var(--d-accent); border-radius: 13px; flex-shrink: 0; }
.guide-kicker { color: #647182; font-size: 12px; display: block; margin-bottom: 3px; }
.guide-card-title strong { font-size: 18px; letter-spacing: -.035em; }
.guide-steps { list-style: none; padding: 0; margin: 14px 0 0; }
.guide-steps li { display: flex; align-items: center; gap: 12px; padding: 10px 0; }

.guide-steps li > svg { color: #68798b; }
.guide-card-note { font-size: 12px; color: #657382; padding-top: 12px; margin: 10px 0 0; border-top: 1px solid #e8edf1; }
.discovery-feed { padding-block: 36px 56px; }
.discovery-feed-head { margin-bottom: 22px; }
.discovery-section-kicker { color: #54697c; font-size: 12px; letter-spacing: .02em; margin-bottom: 7px; }
.discovery-feed-head h2 { font-size: 26px; line-height: 1.35; }
.discovery-feed-head > p { color: #647281; font-size: 14px; }
.discovery-subcategories { gap: 8px; border: 0; padding-bottom: 0; }

.discovery-toolbar { padding: 24px 0 16px; gap: 16px; }
.discovery-result-count { color: #5d6d7c; font-size: 14px; }

.discovery-selects { gap: 8px; }
.discovery-selects label { background: #fff; border: 1px solid #d7dfe6; padding: 0 9px; border-radius: 8px; }

.discovery-applied button { font-size: 13px; min-height: 36px; padding: 8px 11px; color: var(--d-accent); background: var(--d-soft); }
.discovery-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.discovery-event-card { border: 1px solid var(--line); border-radius: 18px; background: #fff; overflow: hidden; min-width: 0; box-shadow: 0 2px 5px #20344804; transition: box-shadow .2s, transform .2s, border-color .2s; }
.discovery-event-card:hover { transform: translateY(-3px); border-color: #b8c5d0; box-shadow: 0 10px 24px #233d5410; }

.discovery-event-poster { height: auto; aspect-ratio: 1.85; position: relative; background: #edf2f5; overflow: hidden; }
.discovery-event-poster img { object-fit: contain; width: 100%; height: 100%; background: #eef2f5; }
.discovery-poster-placeholder { height: 100%; min-height: 170px; padding: 24px; gap: 8px; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #536979; }
.discovery-poster-placeholder > svg { width: 30px; height: 30px; opacity: .7; }
.discovery-poster-placeholder > span { font-size: 11px; letter-spacing: .07em; color: #657789; }
.discovery-poster-placeholder > strong { font-size: 20px; letter-spacing: -.02em; }
.discovery-poster-placeholder > small { color: #677584; font-size: 12px; }
.discovery-poster-comic_doujin { background: #f4eeeb; }
.discovery-poster-doll { background: #f3eef7; }
.discovery-poster-only_event { background: #eef3f9; }
.discovery-poster-birthday_cafe { background: #f8eef1; }

.discovery-event-status { top: 14px; left: 14px; padding: 6px 10px; font-size: 12px; border-radius: 7px; font-weight: 700; background: #fff; color: #3d5266; box-shadow: 0 1px 5px #14253708; }

.discovery-event-meta span { display: block; }
.discovery-event-description { font-size: 14px; color: #617080; line-height: 1.75; margin: 14px 0 18px; }

.discovery-coming-badge { font-size: 12px; }
.discovery-primary { min-height: 46px; font-size: 14px; border-radius: 10px; background: var(--d-accent); padding: 12px 20px; }
.discovery-pagination { margin-top: 30px; gap: 20px; font-size: 14px; }
.discovery-pagination button { min-width: 60px; min-height: 44px; border-radius: 9px; background: #fff; border-color: #cbd5df; color: var(--ink); font-size: 14px; }
.discovery-guide-strip { border: 1px solid #dfe6ed; border-radius: 14px; background: #f0f4f8; padding: 20px; gap: 16px; margin-top: 36px; }
.discovery-guide-label { color: #3c5369; font-size: 14px; }
.discovery-guide-strip p { color: #5b6b7b; font-size: 13px; line-height: 1.75; }
.discovery-guide-strip > a { color: #385b7a; font-size: 13px; min-height: 44px; }
.discovery-back-link { min-height: 40px; font-size: 14px; color: #526d87; }

/* 4. Visit context, booth cards and sale detail ----------------------------- */
.public-shell .visit-page { max-width: 1180px; padding-block: 26px 64px; }
.visit-summary { padding: 26px 28px; background: #fff; border: 1px solid var(--line); border-radius: 20px; margin: 12px 0 20px; gap: 32px; }

.visit-list-heading { margin: 24px 0 16px; }

.catalog-drawer-heading .eyebrow { font-size: 12px; color: #617283; margin-bottom: 7px; }
.catalog-drawer-heading h2 { font-size: 25px; line-height: 1.5; }
