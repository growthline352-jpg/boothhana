services:
  - type: web
    name: boothhana2-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: ADMIN_KAKAO_SUBJECTS
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_PUBLIC_BUCKET
        sync: false
      - key: GCS_PRIVATE_BUCKET
        sync: false
      - key: GCS_PUBLIC_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-service-account.json
      - key: BOOTH_COLLECTOR_TOKEN
        sync: false
      - key: SUPPORT_RATE_SECRET
        generateValue: true
      - key: SUPPORT_GUEST_ENABLED
        value: "false"
      - key: SUPPORT_ATTACHMENTS_ENABLED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
